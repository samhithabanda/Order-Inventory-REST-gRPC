syntax = "proto3";

package shop;

service InventoryService {
  rpc CheckInventory (InventoryRequest) returns (InventoryReply);
}

service OrderService {
  rpc PlaceOrder (OrderRequest) returns (OrderReply);
}

message InventoryRequest {
  string item_id = 1;
  int32 quantity = 2;
}

message InventoryReply {
  bool available = 1;
  int32 remaining = 2;
  string message = 3;
}

message OrderRequest {
  string item_id = 1;
  int32 quantity = 2;
}

message OrderReply {
  string message = 1;
  int32 remaining = 2;
}
